name: Checks
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONPATH: how_to_dress_baby
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: docker build -t baby-display:ci how_to_dress_baby
      - run: >-
          docker run --rm --mount type=bind,source=${{ github.workspace }}/tests,target=/app/tests,readonly
          baby-display:ci python -m unittest discover -s tests -v
