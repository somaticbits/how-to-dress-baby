[project]
name = "how-to-dress-baby"
version = "0.3.1"
description = "Local, weather-aware baby clothing suggestions for a Kindle"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
